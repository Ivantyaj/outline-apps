# Build an installable Android test APK for this fork.
name: Build Outline Split APK

on:
  workflow_dispatch:
  push:
    branches:
      - split-tunneling

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Test sing-box transport and DNS fallback
        run: go test -tags=singboxtest,with_utls ./client/go/outline/configregistry -run '^TestSingbox' -count=1
      - name: Build APK
        run: npm run action client/src/cordova/build android
      - uses: actions/upload-artifact@v4
        with:
          name: outline-split-android-debug
          path: client/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

